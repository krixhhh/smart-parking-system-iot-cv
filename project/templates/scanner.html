<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - Vehicle Plate System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .scanner-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 4/3;
            box-shadow: var(--shadow-md);
        }
        
        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .target-box {
            width: 70%;
            height: 30%;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* Dimming outside effect */
            transition: border-color 0.3s;
        }
        
        .target-box.success {
            border-color: #10b981;
            border-style: solid;
        }

        #loading-indicator {
            display: none;
            color: white;
            margin-top: 1rem;
            font-weight: 600;
            background: rgba(0,0,0,0.6);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
        }
        
        canvas {
            display: none;
        }

        #notification {
            display: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">AutoPlate System</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}" class="nav-item">Dashboard</a>
            <a href="{{ url_for('input_page') }}" class="nav-item active">Scanner</a>
            <a href="{{ url_for('history') }}" class="nav-item">History</a>
            <a href="{{ url_for('logout') }}" class="nav-item">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="scanner-container">
            
            <div id="notification" class="alert"></div>

            <div class="card" style="padding: 1rem;">
                <div class="video-wrapper">
                    <video id="video-feed" autoplay playsinline></video>
                    <div class="overlay">
                        <div class="target-box" id="target-box"></div>
                        <div id="loading-indicator">Processing image...</div>
                    </div>
                </div>
                
                <div style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: center;">
                    <button id="btn-start" class="btn btn-primary">Start Camera</button>
                    <button id="btn-scan" class="btn btn-success" disabled>Capture Image</button>
                </div>
            </div>
            
            <div class="card" id="result-card" style="display: none;">
                <h3 style="margin-bottom: 1rem;">Detected Plate</h3>
                
                <div class="form-group">
                    <label class="form-label" for="vehicle-number">Vehicle Number</label>
                    <input type="text" id="vehicle-number" class="form-control" style="font-size: 1.5rem; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;">
                </div>
                
                <div style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">
                    Confidence: <span id="confidence-score">0</span>%
                </div>
                
                <button id="btn-submit" class="btn btn-primary btn-block">Submit Entry</button>
            </div>
            
            <canvas id="canvas"></canvas>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
</body>
</html>
